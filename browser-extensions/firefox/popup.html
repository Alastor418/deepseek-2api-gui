<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek 2API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 360px;
      padding: 14px;
      margin: 0;
      background: #0f1115;
      color: #e8e8f0;
      font-size: 13px;
    }
    h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #8a8aa0; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      color: #e8e8f0;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      padding: 9px 11px;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      margin-bottom: 10px;
      word-break: break-all;
      line-height: 1.5;
    }
    .status.ok { background: rgba(16,185,129,0.15); color: #86efac; }
    .status.error { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .status.info { background: rgba(99,102,241,0.15); color: #c7d2fe; }
    .hint { font-size: 11px; color: #8a8aa0; line-height: 1.55; margin-top: 10px; }
    .hint code { background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>DeepSeek 2API</h1>

  <div id="status" class="status info">Загрузка…</div>

  <div class="field">
    <label>Адрес локального сервера</label>
    <input id="serverUrl" type="text" placeholder="http://127.0.0.1:8080" />
  </div>

  <button id="sendBtn">Отправить токен сейчас</button>

  <div class="hint">
    1. Открой <code>chat.deepseek.com</code>, залогинься и <b>отправь любое сообщение</b>.<br/>
    2. Токен перехватится автоматически и уйдёт на сервер.<br/>
    3. Если что-то не работает — жми «Отправить токен сейчас».
  </div>

  <script src="popup.js"></script>
</body>
</html>
